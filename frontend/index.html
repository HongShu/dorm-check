<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>查寝管理系统 - 登录</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-title">查寝管理系统</div>
    <div class="login-subtitle">宿管 / 管理员登录</div>

    <div class="form-group">
      <label>账号</label>
      <input type="text" id="username" placeholder="请输入账号" autocomplete="off">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码">
    </div>
    <div id="error" class="error-msg hidden"></div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">登录</button>
  </div>

  <script src="utils/api.js"></script>
  <script>
    const user = getUser();
    if (user) {
      goToHome(user);
    }

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('loginBtn');

      if (!username || !password) {
        errorEl.textContent = '请输入账号和密码';
        errorEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中...';
      errorEl.classList.add('hidden');

      try {
        const user = await login(username, password);
        goToHome(user);
      } catch (e) {
        errorEl.textContent = e.message;
        errorEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = '登录';
      }
    }

    function goToHome(user) {
      if (user.role === 'admin') {
        location.href = 'admin.html';
      } else {
        location.href = 'checker.html';
      }
    }
  </script>
</body>
</html>
